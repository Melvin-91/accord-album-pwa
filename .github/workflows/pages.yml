name: Deploy Accord album PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PWA syntax
        run: |
          node --check app.mjs
          node --check core.mjs
          node --check ui.mjs
          node --check tidal.mjs
          node --check tidal-ui.mjs
          node --check sw.js
          node --check pwa/app.mjs
          node --check pwa/core.mjs
          node --check pwa/ui.mjs
          node --check pwa/tidal.mjs
          node --check pwa/tidal-ui.mjs
          node --check pwa/sw.js
      - name: Run root and nested PWA test suites
        run: node --test core.test.mjs tidal.test.mjs tidal-ui.test.mjs pwa/core.test.mjs pwa/tidal.test.mjs pwa/tidal-ui.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
