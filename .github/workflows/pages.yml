name: Deploy Accord album PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PWA syntax
        run: |
          node --check app.mjs
          node --check core.mjs
          node --check ui.mjs
          node --check tidal.mjs
          node --check tidal-ui.mjs
          node --check sw.js
          node --check collection-app.mjs
          node --check physical-collection.mjs
          node --check physical-collection-sync.mjs
          node --check physical-collection-ui.mjs
          node --check pwa/app.mjs
          node --check pwa/core.mjs
          node --check pwa/ui.mjs
          node --check pwa/tidal.mjs
          node --check pwa/tidal-ui.mjs
          node --check pwa/sw.js
          node --check pwa/collection-app.mjs
          node --check pwa/physical-collection.mjs
          node --check pwa/physical-collection-sync.mjs
          node --check pwa/physical-collection-ui.mjs
      - name: Run root and nested PWA test suites
        run: node --test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Validate uploaded artifact ID
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [[ ! "$ARTIFACT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Pages upload did not return a valid artifact ID."
            exit 1
          fi
      # Use the same Actions artifact service as deploy-pages, without re-uploading.
      - name: Check Pages artifact availability
        id: artifact_first
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-check
      - name: Wait before checking again
        if: steps.artifact_first.outcome == 'failure'
        run: sleep 10
      - name: Retry Pages artifact availability
        id: artifact_second
        if: steps.artifact_first.outcome == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-check
      - name: Wait before final check
        if: steps.artifact_second.outcome == 'failure'
        run: sleep 20
      - name: Final Pages artifact availability check
        if: steps.artifact_second.outcome == 'failure'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact_id }}
          path: ${{ runner.temp }}/pages-artifact-check
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
